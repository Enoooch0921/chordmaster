<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="ChordMaster" />
    <meta name="application-name" content="ChordMaster" />
    <meta name="theme-color" content="#0D1F17" />
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://www.google.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="preconnect" href="https://s.ytimg.com" />
    <title>ChordMaster | 智能和弦與簡譜編輯器</title>
    <script>
      // Apply theme before React mounts to avoid a flash of light theme.
      (function () {
        try {
          var stored = window.localStorage.getItem('chordmaster.theme-mode.v1');
          var mode = stored === 'light' || stored === 'dark' || stored === 'auto' ? stored : 'auto';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'auto' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {
          // localStorage / matchMedia unavailable — render light by default.
        }
      })();
    </script>
    <script>
      (function (location) {
        if (!location.search || location.search[1] !== '/') {
          return;
        }

        var decodedPath = location.search
          .slice(1)
          .split('&')
          .map(function (segment) { return segment.replace(/~and~/g, '&'); })
          .join('?');

        window.history.replaceState(
          null,
          '',
          location.pathname.replace(/\/$/, '') + decodedPath + location.hash
        );
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
